<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Malleable Memory">
  <!-- 可塑性记忆：三层叠加 + 一条记忆的流动曲线。
       三层对应 perm / hot / cold，曲线表示记忆被使用而升降。 -->
  <defs>
    <linearGradient id="mmFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5aa9ff"/>
      <stop offset="100%" stop-color="#8f7bff"/>
    </linearGradient>
  </defs>

  <!-- 底层：卸载层（只给索引，用虚线表示"不占正文"） -->
  <path d="M10 46h44" stroke="#8f7bff" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="5 5" opacity="0.55"/>

  <!-- 中层：加强层 -->
  <path d="M13 36h38" stroke="url(#mmFlow)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- 顶层：永久层（最实） -->
  <path d="M17 25h30" stroke="#5aa9ff" stroke-width="5" stroke-linecap="round"/>

  <!-- 记忆中"被使用而升降"的流动曲线 -->
  <path d="M22 52 C 30 42, 34 30, 42 18" fill="none" stroke="url(#mmFlow)"
        stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="42" cy="18" r="4.5" fill="#8f7bff"/>
  <circle cx="22" cy="52" r="3.5" fill="#5aa9ff" opacity="0.75"/>
</svg>
